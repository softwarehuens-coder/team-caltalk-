name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - 'database/schema.sql'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/schema.sql'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: team_caltalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/team_caltalk_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply database schema
        run: psql "$POSTGRES_CONNECTION_STRING" -f ../database/schema.sql
        env:
          PGPASSWORD: postgres
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run build
      - run: npm test
